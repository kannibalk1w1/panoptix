name: Build Windows executable

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      version:
        description: "Version stamped into the installer filename"
        required: false
        default: "0.1.0"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
              $version = $env:GITHUB_REF -replace '^refs/tags/v', ''
          } elseif ('${{ inputs.version }}') {
              $version = '${{ inputs.version }}'
          } else {
              $version = '0.1.0'
          }
          Write-Host "Building version $version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m unittest discover -s tests -t . -v

      - name: Run browser regression tests
        run: |
          python -m playwright install chromium
          python -m unittest tests.browser_review -v

      - name: Ensure Inno Setup is available
        shell: pwsh
        run: |
          $iscc = @(
              (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source,
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
              "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if ($iscc) {
              # panoptix.iss uses ArchitecturesAllowed=x64compatible, which needs 6.3+.
              Write-Host "Found Inno Setup at $iscc"
              Write-Host "Version: $((Get-Item $iscc).VersionInfo.ProductVersion)"
          } else {
              Write-Host "Inno Setup is missing from the runner image, installing it"
              choco install innosetup --no-progress -y
          }

      - name: Build executable and installer
        shell: pwsh
        run: ./scripts/build_windows.ps1 -Version '${{ steps.version.outputs.version }}' -SkipDependencies

      - name: Upload Panoptix.exe
        uses: actions/upload-artifact@v4
        with:
          name: Panoptix-exe-${{ steps.version.outputs.version }}
          path: dist/Panoptix.exe
          if-no-files-found: error

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Panoptix-Setup-${{ steps.version.outputs.version }}
          path: dist/Panoptix-Setup-*.exe
          if-no-files-found: error
